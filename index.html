<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STS Comprehensive Reviewer — Interactive Flip Cards</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-front: #1e293b;
      --card-back: #172554;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --warning: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
    }
    header {
      text-align: center;
      max-width: 760px;
      width: 100%;
      margin-bottom: 18px;
    }
    h1 { font-size: 1.55rem; color: var(--accent); margin-bottom: 6px; }
    .subtitle { color: var(--muted); font-size: 0.92rem; }
    .controls-top {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      max-width: 760px;
      width: 100%;
      margin-bottom: 14px;
    }
    select, button {
      background: var(--card-front);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover, select:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); color: #0f172a; font-weight: 600; border: none; }
    button.primary:hover { background: var(--accent-hover); color: #fff; }
    button.mastered-btn.active { background: var(--success); color: #052e16; font-weight: 600; border-color: var(--success); }
    .progress-wrap {
      max-width: 760px;
      width: 100%;
      margin-bottom: 16px;
    }
    .stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--card-front);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.25s ease;
    }
    .scene {
      width: 100%;
      max-width: 760px;
      min-height: 390px;
      perspective: 1200px;
      margin-bottom: 18px;
    }
    .card {
      width: 100%;
      min-height: 390px;
      position: relative;
      transition: transform 0.55s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      cursor: pointer;
    }
    .card.is-flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 16px;
      padding: 26px 24px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }
    .card-front { background: var(--card-front); }
    .card-back {
      background: var(--card-back);
      border-color: var(--accent);
      transform: rotateY(180deg);
    }
    .badge-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .badge {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-weight: 600;
    }
    .tap-note { font-size: 0.78rem; color: var(--muted); }
    .question-text {
      font-size: 1.08rem;
      line-height: 1.5;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .choices { list-style: none; display: flex; flex-direction: column; gap: 9px; }
    .choices li {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .hint-box {
      margin-top: 14px;
      padding: 10px 12px;
      background: rgba(245, 158, 11, 0.12);
      border-left: 3px solid var(--warning);
      border-radius: 6px;
      font-size: 0.86rem;
      color: #fde68a;
      display: none;
    }
    .hint-box.visible { display: block; }
    .answer-header {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--success);
      margin-bottom: 12px;
    }
    .rationale {
      font-size: 1.02rem;
      line-height: 1.6;
      color: #e2e8f0;
    }
    .nav-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-width: 760px;
      width: 100%;
    }
    @media (max-width: 520px) {
      .card-face { padding: 20px 16px; }
      .question-text { font-size: 1rem; }
      .scene, .card { min-height: 430px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>STS Comprehensive MCQ Flip Cards</h1>
    <p class="subtitle">Biodiversity &bull; Pandemics &bull; Biotechnology &bull; HIV/AIDS &amp; ART NCLEX &bull; Climate Change 2022</p>
  </header>

  <div class="controls-top">
    <select id="topicFilter" aria-label="Filter by topic">
      <option value="ALL">All Topics (60 Items)</option>
      <option value="Biodiversity & Evolution">Biodiversity, Taxonomy & Evolution</option>
      <option value="Pandemics & Health">Biodiversity & Pandemics</option>
      <option value="Biotechnology & GMOs">Biotechnology & GMOs</option>
      <option value="HIV/AIDS & ART NCLEX">HIV/AIDS & ART NCLEX</option>
      <option value="Climate Change & Food">Climate Change 2022 & Food Systems</option>
    </select>
    <button id="shuffleBtn">Shuffle Deck</button>
    <button id="hintBtn">Show Hint</button>
    <button id="masteredBtn" class="mastered-btn">Mark Mastered</button>
  </div>

  <div class="progress-wrap">
    <div class="stats">
      <span id="counterText">Card 1 of 60</span>
      <span id="masteredText">Mastered: 0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="scene">
    <div class="card" id="flashcard">
      <div class="card-face card-front">
        <div>
          <div class="badge-row">
            <span class="badge" id="cardTopic">Topic</span>
            <span class="tap-note">Tap card to flip &#8635;</span>
          </div>
          <div class="question-text" id="questionText"></div>
          <ul class="choices" id="choicesList"></ul>
          <div class="hint-box" id="hintBox"></div>
        </div>
        <div class="tap-note" style="text-align:right; margin-top:10px;">Front &bull; Question</div>
      </div>

      <div class="card-face card-back">
        <div>
          <div class="badge-row">
            <span class="badge" id="cardTopicBack">Answer &amp; Rationale</span>
            <span class="tap-note">Tap card to flip back &#8635;</span>
          </div>
          <div class="answer-header" id="answerHeader"></div>
          <p class="rationale" id="rationaleText"></p>
        </div>
        <div class="tap-note" style="text-align:right;">Back &bull; Answer</div>
      </div>
    </div>
  </div>

  <div class="nav-row">
    <button id="prevBtn">&larr; Previous</button>
    <button id="flipBtn" class="primary">Flip Card</button>
    <button id="nextBtn">Next &rarr;</button>
  </div>

  <script>

    const cardTopicEl = document.getElementById("cardTopic");

    const choicesListEl = document.getElementById("choicesList");
    const hintBoxEl = document.getElementById("hintBox");
    const answerHeaderEl = document.getElementById("answerHeader");
    const rationaleTextEl = document.getElementById("rationaleText");
    const counterTextEl = document.getElementById("counterText");
    const masteredTextEl = document.getElementById("masteredText");
    const progressFillEl = document.getElementById("progressFill");
    const masteredBtn = document.getElementById("masteredBtn");
    const hintBtn = document.getElementById("hintBtn");

    function renderCard() {
      const item = filteredDeck[currentIndex];
      flashcardEl.classList.remove("is-flipped");
      hintBoxEl.classList.remove("visible");
      hintBtn.textContent = "Show Hint";

      cardTopicEl.textContent = item.topic;
      questionTextEl.textContent = item.q;
      choicesListEl.innerHTML = item.choices.map(c => `<li>${c}</li>`).join("");
      hintBoxEl.textContent = "Hint: " + item.hint;

      answerHeaderEl.textContent = item.ans;
      rationaleTextEl.textContent = item.rat;

      counterTextEl.textContent = `Card ${currentIndex + 1} of ${filteredDeck.length}`;
      masteredTextEl.textContent = `Mastered: ${masteredSet.size} / ${deckData.length}`;
      progressFillEl.style.width = `${((currentIndex + 1) / filteredDeck.length) * 100}%`;

      if (masteredSet.has(item.q)) {
        masteredBtn.classList.add("active");
        masteredBtn.textContent = "✓ Mastered";
      } else {
        masteredBtn.classList.remove("active");
        masteredBtn.textContent = "Mark Mastered";
      }
    }

    flashcardEl.addEventListener("click", () => flashcardEl.classList.toggle("is-flipped"));
    document.getElementById("flipBtn").addEventListener("click", () => flashcardEl.classList.toggle("is-flipped"));

    document.getElementById("prevBtn").addEventListener("click", () => {
      currentIndex = (currentIndex - 1 + filteredDeck.length) % filteredDeck.length;
      renderCard();
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % filteredDeck.length;
      renderCard();
    });

    document.getElementById("shuffleBtn").addEventListener("click", () => {
      for (let i = filteredDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [filteredDeck[i], filteredDeck[j]] = [filteredDeck[j], filteredDeck[i]];
      }
      currentIndex = 0;
      renderCard();
    });

    hintBtn.addEventListener("click", () => {
      const isVisible = hintBoxEl.classList.toggle("visible");
      hintBtn.textContent = isVisible ? "Hide Hint" : "Show Hint";
    });

    masteredBtn.addEventListener("click", () => {
      const key = filteredDeck[currentIndex].q;
      if (masteredSet.has(key)) masteredSet.delete(key);
      else masteredSet.add(key);
      renderCard();
    });

    document.getElementById("topicFilter").addEventListener("change", (e) => {
      const val = e.target.value;
      filteredDeck = val === "ALL" ? [...deckData] : deckData.filter(d => d.topic === val);
      currentIndex = 0;
      renderCard();
    });

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") { e.preventDefault(); flashcardEl.classList.toggle("is-flipped"); }
      if (e.code === "ArrowRight") { currentIndex = (currentIndex + 1) % filteredDeck.length; renderCard(); }
      if (e.code === "ArrowLeft") { currentIndex = (currentIndex - 1 + filteredDeck.length) % filteredDeck.length; renderCard(); }
    });

    renderCard();
  </script>
</body>
</html>
